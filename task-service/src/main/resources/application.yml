# task-service/src/main/resources/application.yml
server:
  port: 8082

spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: task-service

  datasource:
    url: jdbc:postgresql://localhost:5434/tasks_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis

logging:
  level:
    org.springframework.data.redis: INFO
    org.springframework.cache: INFO
