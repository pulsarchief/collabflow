server:
  port: 8081

spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5433/users_db?options=-c%20TimeZone=Asia/Kolkata
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET:THIS_IS_A_VERY_SECURE_256_BIT_SECRET_KEY_FOR_JWT}
