server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: gateway

  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**, /users/**
          filters:
            - StripPrefix=0
            - JwtAuth

        - id: task-service
          uri: http://localhost:8082
          predicates:
            - Path=/tasks/**, /projects/**
          filters:
            - StripPrefix=0
            - JwtAuth

        - id: notification-service
          uri: ws://localhost:8083
          predicates:
            - Path=/ws/**
          filters:
            - StripPrefix=0

jwt:
  secret: ${JWT_SECRET:THIS_IS_A_VERY_SECURE_256_BIT_SECRET_KEY_FOR_JWT}